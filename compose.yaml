# lazyit — canonical Compose definition (ALL services). See ADR-0025/0026/0028/0102 and
# docs/05-runbooks/.
#
# This single file is the source of truth for every service. Profiles split the audiences:
#   - UNPROFILED backing services (db, meilisearch, valkey) come up by default and back native
#     `bun run dev` (api/web run on the host). `compose.override.yaml` (auto-loaded) tunes THEM
#     for dev: loopback-only ports, no TLS, no resource ceilings.
#   - profiles: [prod] services (api, web, migrate, caddy, backup) only come up under --profile prod,
#     i.e. the full containerized stack.
#
# Auth is local accounts (AUTH_MODE=local, the default) or your own OIDC IdP (AUTH_MODE=oidc, BYOI).
# Both use the same services; BYOI only sets the OIDC_* / AUTH_* values in .env.prod. No IdP ships
# here: the bundled Zitadel was removed (ADR-0102).
#
# DEV (from the repo ROOT) — backing services only, loopback ports, apps run via `bun run dev`:
#   docker compose up -d            # auto-merges compose.override.yaml
#
# PROD (from the repo ROOT), after `cp infra/env/.env.prod.example infra/env/.env.prod`:
#   docker compose -f compose.yaml -f infra/docker-compose.prod.yaml \
#     --profile prod --env-file infra/env/.env.prod up -d --build
#
# --env-file is required in prod: the `environment:` blocks use ${VAR} interpolation resolved by
# Compose at parse time (from shell or --env-file), NOT from the service's env_file directive.
#
# Only Caddy publishes host ports in prod (8080/8443 by default). db/api/web stay on the internal
# network — Postgres is never exposed to the host (SEC-005 / ADR-0028).
#
# Image digest-pinning (ADR-0025 follow-up): every base image is pinned by @sha256 so a deploy is
# byte-reproducible and a re-pulled rolling tag (node:26-alpine, caddy:2-alpine) can't silently
# change underneath the operator. The human-readable tag is kept in a comment beside each digest;
# re-pin after a deliberate upgrade with the command noted at the bottom of this file.
#
# Log rotation + resource limits: every long-running service gets the shared `logging` anchor
# (json-file, 10m x 3) so container logs can't fill the disk over months, plus a modest
# mem_limit/cpus ceiling so one runaway service can't OOM/CPU-starve the single host. Tune the
# limits to your box; the sizing table lives in docs/05-runbooks/deploy-self-hosted.md.
# (compose.override.yaml drops these for plain dev — they only bind under the prod merge.)

name: lazyit

# Shared log-rotation policy — referenced by every long-running service via `logging: *default-logging`.
# Caps each container's json-file log at 10 MB x 3 files (30 MB), preventing unbounded growth on a
# long-lived single host (would otherwise fill /var/lib/docker and crash the Docker daemon).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # --- PostgreSQL — internal network only, no published port (prod) ---------
  # UNPROFILED: comes up on plain `docker compose up` for native dev. compose.override.yaml
  # publishes 127.0.0.1:5432 and drops the resource ceiling for local work.
  db:
    # postgres:18-alpine — pinned by digest (rolling tag; re-pin on a deliberate bump).
    image: postgres:18-alpine@sha256:96d56f7f57c6aacd1fcb908bc83b345ec5f83231ee486dd66a1baadce274db88
    restart: unless-stopped
    shm_size: 256mb
    logging: *default-logging
    # Holds ALL app data — give it the most RAM headroom on the host.
    mem_limit: 1g
    cpus: 1.5
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lazyit}
    volumes:
      # postgres:18 mounts the volume parent (PGDATA = /var/lib/postgresql/18/docker). Keep this
      # path tracking the major version on any upgrade — see docs/05-runbooks/backups.md.
      - db_data:/var/lib/postgresql
    healthcheck:
      # $$ escapes compose interpolation so the check reads the container's env at runtime
      # (works for both the dev POSTGRES_USER=postgres and the prod POSTGRES_USER=lazyit).
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-lazyit} -d $${POSTGRES_DB:-lazyit}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [internal]

  # --- One-shot migrate + seed: runs after db is healthy, before the API (prod) ----
  migrate:
    profiles: [prod]
    build:
      context: .
      dockerfile: infra/docker/migrate.Dockerfile
    image: lazyit-migrate:dev
    restart: "no"
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.0
    env_file: [infra/env/.env.prod]
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  # --- API (NestJS on Node) — internal only (prod) ------------------------
  api:
    profiles: [prod]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      args:
        # Version identity (ADR-0083): infra/start.sh exports LAZYIT_VERSION/LAZYIT_GIT_SHA from the
        # checkout (`git describe --tags --always` / short HEAD sha); a hand-run compose without them
        # honestly builds as dev/unknown. Surfaced by GET /instance/version.
        APP_VERSION: ${LAZYIT_VERSION:-dev}
        GIT_SHA: ${LAZYIT_GIT_SHA:-unknown}
    image: lazyit-api:dev
    restart: unless-stopped
    logging: *default-logging
    # 768m (not 512m) so the V8 heap cap — not this cgroup — is the binding constraint on the
    # sandboxed import child (OPS-5/SEC-002). The forked import worker is capped at
    # IMPORT_CHILD_HEAP_MB (default 256, see apps/api/src/articles/import/import-job.constants.ts):
    # a .docx decompression bomb must make the CHILD's V8 abort, not push parent+child past the
    # cgroup so the kernel OOM-killer takes the whole API instead. Invariant (concurrency=1):
    # mem_limit must comfortably exceed NestJS baseline RSS (~250m) + IMPORT_CHILD_HEAP_MB. With
    # 256m heap that floor is ~506m, so 512m was too tight; 768m leaves real headroom. Document
    # in docs/05-runbooks/deploy-self-hosted.md §6 when tuning either number.
    mem_limit: 768m
    cpus: 1.0
    env_file: [infra/env/.env.prod]
    volumes:
      # User-uploaded attachment blobs (ADR-0082): asset documents + KB inline images,
      # content-addressed by sha256, served API-only behind per-parent authz. Backed up by the
      # `backup` sidecar below (read-only mount, a verified tarball per run beside the DB dump —
      # #1467; restore order in docs/05-runbooks/backups.md).
      - attachments_data:/app/attachments
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # BullMQ broker must be accepting connections before the worker/queue wire up (ADR-0053).
      valkey:
        condition: service_healthy
    networks: [internal]

  # --- Web (Next.js standalone on Node) — internal only (prod) ------------
  web:
    profiles: [prod]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        # Baked at build time. Relative /api keeps the image domain-portable (ADR-0026).
        NEXT_PUBLIC_API_URL: /api
        # Version identity (ADR-0083) — same wiring as the api service above.
        APP_VERSION: ${LAZYIT_VERSION:-dev}
        GIT_SHA: ${LAZYIT_GIT_SHA:-unknown}
    image: lazyit-web:dev
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    cpus: 0.5
    # Auth.js runs server-side and reads these at RUNTIME (ADR-0039). Scoped explicitly rather
    # than env_file so the web container never sees the DB / Meili secrets it has no use for
    # (ADR-0028 least-privilege). Requires --env-file for the ${...} interpolation.
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"            # trust Caddy's X-Forwarded-Host (behind reverse proxy)
      # Canonical public origin. Pins the OIDC redirect_uri to the external URL
      # (https://host/api/auth/callback/oidc); without it Auth.js infers the container's own
      # 0.0.0.0:3000 and the redirect_uri won't match what's registered in the IdP.
      # ${WEB_ORIGIN:-} (not ${WEB_ORIGIN}) so host-agnostic LAN mode (WEB_ORIGIN unset, ADR-0087) does
      # not trip a compose "variable is not set" warning. Empty AUTH_URL → Auth.js derives the base URL
      # from the request Host (AUTH_TRUST_HOST=true). local/real still pin the explicit origin.
      AUTH_URL: ${WEB_ORIGIN:-}
      # Internal API base for server-side fetches (proxy.ts first-run gate + SSR API calls).
      # NEXT_PUBLIC_API_URL is baked as the relative `/api` for browser calls (domain-portable,
      # ADR-0026), but relative URLs throw in Node's undici fetch — the server needs an absolute
      # origin. `api` resolves on the internal Docker network; Caddy handles the public path.
      INTERNAL_API_URL: http://api:3001
      # BYOI only (AUTH_MODE=oidc): your IdP's client. Left empty in local mode.
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:-}
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET:-}
      AUTH_INTERNAL_ISSUER: ${AUTH_INTERNAL_ISSUER:-}
    networks: [internal]

  # --- Meilisearch — internal network only, no published port (prod) ---------------
  # ADR-0035: cross-entity search engine. Fail-soft: the API SearchService no-ops when Meili is
  # down, so no depends_on from api → meilisearch is needed.
  # Index population is automatic: on boot the API rebuilds any missing/empty index from Postgres in
  # the background (SearchBootstrapService, #370/#1216); `reindex:all` in the migrate image stays the
  # manual full repair — docs/05-runbooks/deploy-self-hosted.md §2a.
  # UNPROFILED: comes up on plain `docker compose up`. compose.override.yaml publishes 127.0.0.1:7700.
  meilisearch:
    # getmeili/meilisearch:v1.53.2 (community edition, MIT) — pinned by digest. Version policy
    # (ADR-0035 amendment 2026-09-26): the server is the Meilisearch minor that the pinned
    # `meilisearch` client's own CI tests against (latest patch). .github/workflows/ci.yml runs the
    # wire test against this SAME pin and fails if the two drift — bump both together.
    image: getmeili/meilisearch:v1.53.2@sha256:c94e58ca09662dd6e65e8f1b0fd145767be3da7d5422a863a27b8d2b68e090c9
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.0
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      # The data volume is named after the EXACT server version (ADR-0035 amendment 2026-09-26). A
      # Meilisearch database only opens on the exact engine version that wrote it (major.minor.patch —
      # v1.53.2 refuses a v1.12.3 data dir), and the index is rebuildable from Postgres, so every server
      # bump (patch included) renames this volume: the engine starts empty and the API's boot
      # self-heal rebuilds every index from the database in the background. The previous volume
      # (`meili_data`, v1.12.3) is left untouched for the operator to remove; it is also what a
      # rollback to an earlier tag uses. A server bump that forgot to rename this volume would
      # crash-loop Meilisearch on every existing instance — rename it in the same change.
      # Meili data need not be backed up (see docs/05-runbooks/backups.md).
      - meili_data_v1_53_2:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [internal]

  # --- Valkey — BullMQ broker for async workers, internal network only (prod) ------
  # ADR-0053: BullMQ requires a Redis-protocol server; Valkey is the Linux Foundation BSD-3 fork of
  # Redis 7.2 — wire-compatible (ioredis/BullMQ treat it as Redis), clean redistribution licence, low
  # footprint. AOF persistence (appendonly yes, appendfsync everysec) so queued jobs survive a restart —
  # durability the backups/workflow jobs need. PostgreSQL stays the system of record; this is transport.
  # UNPROFILED: comes up on plain `docker compose up` so native `bun run dev` can reach it (like db /
  # meilisearch). Never published to the host in prod — internal network only (SEC-005 /
  # ADR-0028). compose.override.yaml publishes 127.0.0.1:6379 and drops the resource ceiling for dev.
  valkey:
    # valkey/valkey:8-alpine — pinned by digest (rolling tag; re-pin on a deliberate bump).
    image: valkey/valkey:8-alpine@sha256:77643d152547b446fc15cbafaff22004545663fcd40c6b28038ad283837baa75
    restart: unless-stopped
    logging: *default-logging
    # Modest ceiling — a small-team queue is lightweight (job metadata, not bulk data).
    mem_limit: 256m
    cpus: 0.5
    # Enable AOF so queued jobs are durable across a restart; everysec balances safety vs. fsync cost.
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - valkey_data:/data
    healthcheck:
      # valkey-cli ships in the image; PONG => the server accepts connections.
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [internal]

  # --- Caddy reverse proxy + automatic HTTPS — the only public surface (prod) -----
  caddy:
    profiles: [prod]
    # caddy:2-alpine — pinned by digest (rolling tag; re-pin on a deliberate bump).
    image: caddy:2-alpine@sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    cpus: 0.5
    env_file: [infra/env/.env.prod]
    ports:
      - "${LAZYIT_HTTP_PORT:-8080}:80"
      - "${LAZYIT_HTTPS_PORT:-8443}:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      # Gate on real readiness (service_healthy), not mere process start, so Caddy doesn't
      # publish 502s while the API/web are still booting. Both expose a Dockerfile HEALTHCHECK.
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      # Caddy is the only public-facing service; without a healthcheck a wedged proxy would still
      # report "running". BusyBox wget (shipped in caddy:2-alpine) probes the internal-only plain-HTTP
      # health site the Caddyfile serves on :2021 — chosen because this wget can't skip TLS verification
      # (internal CA on :443) nor avoid following the :80 -> https 308. A 200 here means the Caddy
      # process is up and serving its config. :2021 is never published, so it adds no public surface.
      test: ["CMD-SHELL", "wget -q -O /dev/null -T 3 http://127.0.0.1:2021/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [internal]

  # --- Backup sidecar — cron + pg_dump of the app DB + a tarball of the attachments volume (prod) ---
  # Listed in the `prod` and `backup` profiles. Compose enables a service when ANY of its profiles is
  # active, so `--profile prod` alone (what infra/start.sh and infra/update.sh run) already starts it;
  # `--profile backup` or naming the service brings it up on its own:
  #   docker compose -f compose.yaml -f infra/docker-compose.prod.yaml \
  #     --profile prod --profile backup --env-file infra/env/.env.prod up -d backup
  # Each run dumps the app DB, then archives the attachments volume (#1467) under the SAME timestamp
  # (app-<ts>.dump + attachments-<ts>.tar.gz — a matched pair) to the host-mounted ./backups dir,
  # prunes each kind past its own retention window (dumps 14 d, tarballs 7 d by default; the tarball
  # can be switched off with BACKUP_ATTACHMENTS=false), and (optional, OFF by default) runs an offsite hook
  # on each file. DB first, then blobs: attachments are written blob-first (ADR-0082 §3), so every
  # row in the dump already has its blob on disk when the tarball is taken.
  # Respects "no mandatory cloud" — local-disk only unless you wire BACKUP_OFFSITE_CMD.
  # Full DR procedure (what/order/restore): docs/05-runbooks/backups.md.
  backup:
    profiles: [prod, backup]
    # Same Postgres major as the app DB so pg_dump's client matches the server (avoids version
    # mismatch errors). Pinned by digest to match the `db` service.
    image: postgres:18-alpine@sha256:96d56f7f57c6aacd1fcb908bc83b345ec5f83231ee486dd66a1baadce274db88
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    cpus: 0.5
    env_file: [infra/env/.env.prod]
    environment:
      # Cron schedule (crontab syntax). Default: daily at 02:30.
      BACKUP_CRON: ${BACKUP_CRON:-30 2 * * *}
      # Keep DB dumps newer than this many days; older ones are pruned after each successful dump.
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # Archive the attachments volume on every run (#1467). Default ON; `false` (or 0/no/off) skips the
      # tarball — for an operator who backs the volume up another way (host snapshots, …). The DB dump
      # is unaffected either way. Any other value fails the attachments step loud.
      BACKUP_ATTACHMENTS: ${BACKUP_ATTACHMENTS:-true}
      # Keep attachments tarballs newer than this many days — its OWN window, shorter than the dumps'
      # by default because each tarball is a full copy of the volume (CEO decision 2026-10-21, #1467).
      # Existing tarballs keep ageing out by it even with BACKUP_ATTACHMENTS=false.
      BACKUP_ATTACHMENTS_RETENTION_DAYS: ${BACKUP_ATTACHMENTS_RETENTION_DAYS:-7}
      # Free space (MB) the attachments tarball must leave on the ./backups filesystem. The run checks
      # `du` of the volume against `df` of /backups BEFORE writing and refuses (loud FAILED line, last
      # good tarball kept, the DB dump unaffected) rather than fill the disk the database lives on.
      BACKUP_MIN_FREE_MB: ${BACKUP_MIN_FREE_MB:-1024}
      # App DB connection (reuses the shared POSTGRES_* + the `db` service name).
      PGHOST: db
      # OPTIONAL offsite copy — OFF unless set. Runs once per file the run produced (the app dump, then
      # the attachments tarball), with that file's path as $1 (e.g. an rclone/scp one-liner). Leave
      # unset to keep backups local-disk only (no mandatory cloud).
      BACKUP_OFFSITE_CMD: ${BACKUP_OFFSITE_CMD:-}
      # OPTIONAL failure alert hook — OFF unless set. Runs when a dump fails (non-zero pg_dump,
      # or an empty/unrestorable dump), the attachments tarball fails (not enough free space, tar
      # error, or an archive that does not verify) or the offsite hook fails. Receives a one-line
      # reason as $1.
      # Mirrors BACKUP_OFFSITE_CMD so a self-hosted operator can wire their own notifier — there is
      # no built-in vendor integration (ADR-0028 "no mandatory cloud"). A failed run is ALWAYS loud
      # in the logs ("[lazyit-backup] FAILED ...") and exits non-zero whether or not this is set.
      BACKUP_ON_FAILURE_CMD: ${BACKUP_ON_FAILURE_CMD:-}
    volumes:
      # Dumps land on the host (repo-root ./backups) so they survive `down`/recreate and can be
      # copied off-host. ./backups is gitignored.
      - ./backups:/backups
      # The attachments volume (ADR-0082), READ-ONLY: the sidecar only ever reads blobs to archive
      # them. A restore writes through a separate, explicit mount (docs/05-runbooks/backups.md).
      - attachments_data:/attachments:ro
    depends_on:
      db:
        condition: service_healthy
    # Generate a crontab, then run cron in the foreground. Every shell `$` is written as `$$` so
    # Compose's parse-time ${...} interpolation leaves them intact for the container shell at
    # RUNTIME. POSTGRES_* come from env_file, and the cron job inherits them directly from
    # `exec crond` (no env-export file; see the note by the crontab below). The job writes timestamped
    # custom-format (-Fc) dumps and attachments tarballs (.tar.gz) and prunes by mtime. `crond -f -d 8`
    # keeps the container alive and logs to stdout (json-file driver + rotation).
    command:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /backups
        cat > /usr/local/bin/lazyit-backup <<'SCRIPT'
        #!/bin/sh
        # Fail-loud backup. The corrupt-dump trap this guards against: a plain `pg_dump > final.dump`
        # truncates the FINAL path before pg_dump runs, so a mid-run failure (DB down, disk full, OOM,
        # network blip) leaves a 0-byte/truncated file matching the app-*.dump glob — the retention
        # sweep and an `ls` then treat it as a real backup, and a partial -Fc dump is unrestorable.
        # Fix (issue #588): dump to a *.partial temp path, verify it's non-empty AND restorable
        # (pg_restore -l reads the -Fc archive's table of contents — fails on a truncated archive),
        # and only THEN atomically rename onto the final path. Any failure removes the partial,
        # leaves the last good dump untouched, logs a greppable "[lazyit-backup] FAILED" line to
        # stderr, optionally fires BACKUP_ON_FAILURE_CMD, and exits non-zero so cron + monitoring see it.
        set -eu
        TS="$$(date +%Y%m%d-%H%M%S)"
        echo "[lazyit-backup] starting run $$TS"

        # run_hook CMD ARG: run an operator hook (BACKUP_OFFSITE_CMD / BACKUP_ON_FAILURE_CMD) with ARG
        # as $$1. The documented form names "$$1" inside the command (`rclone copy "$$1" offsite:lazyit/`)
        # and runs as written. A command that does not mention $$1 keeps the original behaviour: ARG is
        # appended as its last argument. (Before this, ARG was ALWAYS appended, so the documented form
        # ran as `rclone copy FILE offsite:lazyit/ FILE` and failed.)
        run_hook() {
          case "$$1" in
            *'$$1'*|*'$${1}'*) sh -c "$$1" _ "$$2" ;;
            *) sh -c "$$1 \"\$$1\"" _ "$$2" ;;
          esac
        }

        # fail REASON: loud, greppable, actionable. Stderr + non-zero exit so the failure is never
        # mistaken for success; runs the optional alert hook (its own failure must not mask the
        # original reason). A failed run intentionally aborts here — a partial dump is never promoted.
        fail() {
          echo "[lazyit-backup] FAILED run $$TS: $$1" >&2
          if [ -n "$${BACKUP_ON_FAILURE_CMD:-}" ]; then
            run_hook "$$BACKUP_ON_FAILURE_CMD" "[lazyit-backup] run $$TS: $$1" \
              || echo "[lazyit-backup] on-failure hook itself failed for run $$TS" >&2
          fi
          exit 1
        }

        # dump_db LABEL FINAL_PATH PGPASSWORD HOST USER DB: dump to FINAL_PATH.partial, verify, then
        # atomically promote. Same filesystem (the /backups mount), so mv is atomic — a reader/glob
        # never sees a half-written final file.
        dump_db() {
          label="$$1"; final="$$2"; pw="$$3"; host="$$4"; user="$$5"; db="$$6"
          partial="$${final}.partial"
          rm -f "$$partial"
          if ! PGPASSWORD="$$pw" pg_dump -h "$$host" -U "$$user" -d "$$db" -Fc > "$$partial"; then
            rm -f "$$partial"
            fail "$$label pg_dump exited non-zero (DB unreachable / disk full / OOM?); $$final NOT written, last good dump kept"
          fi
          if [ ! -s "$$partial" ]; then
            rm -f "$$partial"
            fail "$$label dump is empty; $$final NOT written, last good dump kept"
          fi
          if ! pg_restore -l "$$partial" > /dev/null 2>&1; then
            rm -f "$$partial"
            fail "$$label dump is truncated/corrupt (pg_restore -l could not read it); $$final NOT written, last good dump kept"
          fi
          mv "$$partial" "$$final"
          echo "[lazyit-backup] $$label DB -> $$final ($$(wc -c < "$$final") bytes, restorable)"
        }

        # whole_number VALUE: print VALUE as a plain decimal, or fail if it is not all digits. Leading
        # zeros are stripped — shell arithmetic reads 08 as (invalid) octal and aborts the whole run under
        # `set -e`, skipping prune, offsite and the alert hook; an empty result is 0.
        whole_number() {
          case "$$1" in ''|*[!0-9]*) return 1 ;; esac
          n="$$(echo "$$1" | sed 's/^0*//')"
          echo "$${n:-0}"
        }

        # tar_attachments FINAL_PATH: archive the attachments volume (read-only at /attachments) to
        # FINAL_PATH.partial, verify, then atomically promote — dump_db's partial -> verify -> rename
        # discipline. Unlike dump_db it does NOT abort the run: it returns non-zero with the reason in
        # ATT_ERR, so the already-promoted DB dump still gets its retention sweep and offsite copy, and
        # the run then fails loud at the end. tmp/ (in-flight uploads, never referenced by a row) is
        # left out. Blobs are immutable, content-addressed files promoted by an atomic rename
        # (ADR-0082 §2-3), so archiving a live volume never captures a half-written blob.
        tar_attachments() {
          final="$$1"; partial="$${final}.partial"
          rm -f "$$partial"
          if [ ! -d /attachments ]; then
            ATT_ERR="attachments volume is not mounted at /attachments; $$final NOT written"
            return 1
          fi
          if ! min_free_mb="$$(whole_number "$${BACKUP_MIN_FREE_MB:-}")"; then
            ATT_ERR="BACKUP_MIN_FREE_MB must be a whole number of MB (got '$${BACKUP_MIN_FREE_MB:-}'); $$final NOT written, last good tarball kept"
            return 1
          fi
          # Disk guard: the blobs are mostly already-compressed (PDF, JPEG/PNG/WebP, docx/xlsx), so the
          # tarball is about the size of the volume. Refuse BEFORE writing if it would leave less than
          # BACKUP_MIN_FREE_MB free on the ./backups filesystem — usually the disk Postgres lives on.
          need_kb="$$(du -sk /attachments | awk '{print $$1}')"
          avail_kb="$$(df -Pk /backups | awk 'NR==2 {print $$4}')"
          case "$${need_kb}:$${avail_kb}" in
            [0-9]*:[0-9]*) ;;
            *)
              ATT_ERR="could not measure the attachments volume or the free space on /backups (du='$${need_kb}', df='$${avail_kb}'); $$final NOT written, last good tarball kept"
              return 1 ;;
          esac
          reserve_kb=$$((min_free_mb * 1024))
          if [ $$((avail_kb - need_kb)) -lt "$$reserve_kb" ]; then
            ATT_ERR="not enough free space for the attachments tarball (volume $${need_kb} KB, free $${avail_kb} KB on /backups, BACKUP_MIN_FREE_MB=$${BACKUP_MIN_FREE_MB}); $$final NOT written, last good tarball kept"
            return 1
          fi
          # One retry: a blob the attachments GC unlinks mid-archive makes tar fail; the second pass
          # simply no longer sees it.
          if ! tar -czf "$$partial" -C /attachments --exclude ./tmp .; then
            echo "[lazyit-backup] attachments tar failed once; retrying" >&2
            rm -f "$$partial"
            if ! tar -czf "$$partial" -C /attachments --exclude ./tmp .; then
              rm -f "$$partial"
              ATT_ERR="attachments tar exited non-zero twice (disk full / unreadable file?); $$final NOT written, last good tarball kept"
              return 1
            fi
          fi
          # Verify: gzip -t checks the CRC of the whole stream (fails on truncation or corruption), and
          # tar -t walks every header — the tarball analogue of dump_db's pg_restore -l.
          if ! gzip -t "$$partial" 2>/dev/null || ! tar -tzf "$$partial" > /dev/null 2>&1; then
            rm -f "$$partial"
            ATT_ERR="attachments tarball is truncated/corrupt (gzip -t / tar -t could not read it); $$final NOT written, last good tarball kept"
            return 1
          fi
          mv "$$partial" "$$final"
          blobs="$$(tar -tzf "$$final" | grep -c '^\./[0-9a-f][0-9a-f]/.' || true)"
          echo "[lazyit-backup] attachments -> $$final ($$(wc -c < "$$final") bytes, $${blobs} blob(s), verified)"
        }

        # 1. App DB — POSTGRES_USER/PASSWORD/DB come from the shared .env.prod (env_file). A failure here
        # aborts the run (no tarball without its matching dump).
        dump_db "app" "/backups/app-$${TS}.dump" "$$POSTGRES_PASSWORD" "$$PGHOST" "$$POSTGRES_USER" "$$POSTGRES_DB"

        # 2. Attachments — AFTER the dump, under the SAME timestamp. Blobs are written before their row
        # (ADR-0082 §3), so every row in the dump already has its blob in this tarball; a blob uploaded
        # in between is row-less in the dump and the GC reclaims it after a restore.
        ERRS=""
        ATT_ERR=""
        ATT_FILE="/backups/attachments-$${TS}.tar.gz"
        ATT_PRUNE=1
        if ! att_days="$$(whole_number "$${BACKUP_ATTACHMENTS_RETENTION_DAYS:-}")"; then
          ATT_ERR="BACKUP_ATTACHMENTS_RETENTION_DAYS must be a whole number of days (got '$${BACKUP_ATTACHMENTS_RETENTION_DAYS:-}'); no attachments tarball written or pruned"
          ATT_PRUNE=0
        fi
        if [ -z "$$ATT_ERR" ]; then
          case "$$(echo "$${BACKUP_ATTACHMENTS:-true}" | tr 'A-Z' 'a-z')" in
            true|1|yes|on)
              if ! tar_attachments "$$ATT_FILE"; then ATT_PRUNE=0; fi ;;
            false|0|no|off)
              echo "[lazyit-backup] attachments: skipped (BACKUP_ATTACHMENTS=$${BACKUP_ATTACHMENTS}); the DB dump is NOT paired with a tarball" ;;
            *)
              ATT_ERR="BACKUP_ATTACHMENTS must be true or false (got '$${BACKUP_ATTACHMENTS}'); no attachments tarball written"
              ATT_PRUNE=0 ;;
          esac
        fi
        if [ -n "$$ATT_ERR" ]; then
          echo "[lazyit-backup] attachments step failed: $$ATT_ERR" >&2
          ERRS="$$ATT_ERR"
        fi

        # Retention sweep — dumps older than BACKUP_RETENTION_DAYS, tarballs older than
        # BACKUP_ATTACHMENTS_RETENTION_DAYS, each kind only after a successful (or deliberately skipped)
        # run of that kind (a failing step never prunes its last good copies). Only ever
        # matches app-*.dump / attachments-*.tar.gz (verified, promoted) files, so nothing else an
        # operator keeps here (e.g. an old zitadel-*.dump, an update.sh pre-update-*.dump) is pruned;
        # *.partial temp files are never left behind on the happy path and are removed on failure, so
        # a corrupt run can never be retained as a "real" backup.
        find /backups -name 'app-*.dump' -type f -mtime "+$${BACKUP_RETENTION_DAYS}" -print -delete || true
        if [ "$$ATT_PRUNE" = 1 ]; then
          find /backups -name 'attachments-*.tar.gz' -type f -mtime "+$${att_days}" -print -delete || true
        fi

        # Optional offsite hook (OFF unless BACKUP_OFFSITE_CMD is set). Runs once per file this run
        # verified + promoted — the dump, then the tarball — with that path as $$1. An offsite failure
        # is loud + non-zero (the local copies are safe, but the offsite copy didn't happen).
        if [ -n "$${BACKUP_OFFSITE_CMD:-}" ]; then
          for f in "/backups/app-$${TS}.dump" "$$ATT_FILE"; do
            [ -f "$$f" ] || continue
            if ! run_hook "$$BACKUP_OFFSITE_CMD" "$$f"; then
              msg="offsite hook failed for $$f (local copy is intact; offsite copy did NOT happen)"
              echo "[lazyit-backup] $$msg" >&2
              ERRS="$${ERRS:+$$ERRS; }$$msg"
            fi
          done
        fi
        [ -z "$$ERRS" ] || fail "$$ERRS"
        echo "[lazyit-backup] run $$TS complete"
        SCRIPT
        chmod +x /usr/local/bin/lazyit-backup
        # The cron JOB inherits this shell's environment directly: BusyBox crond (1.37, the alpine
        # build) propagates the env it was started with to every job it runs, so we do NOT
        # materialise a sourced printenv export file. The previous `printenv | sed 's/^/export /'`
        # approach was metacharacter-UNSAFE — a POSTGRES_PASSWORD containing shell metacharacters
        # ($, `, ;, &, ', spaces) would be re-parsed/expanded when the cron shell sourced the file,
        # silently breaking pg_dump. Direct inheritance sidesteps all quoting: each value reaches
        # `lazyit-backup` verbatim (verified: a hostile password with $`;&"'-space round-trips
        # byte-for-byte). env_file + the `environment:` block above populate this shell, and
        # `exec crond` below replaces it while keeping that env.
        echo "$$BACKUP_CRON /usr/local/bin/lazyit-backup >> /proc/1/fd/1 2>&1" > /etc/crontabs/root
        echo "[lazyit-backup] scheduled: $$BACKUP_CRON -> /backups (app DB, retention $${BACKUP_RETENTION_DAYS}d; attachments=$${BACKUP_ATTACHMENTS}, retention $${BACKUP_ATTACHMENTS_RETENTION_DAYS}d)"
        exec crond -f -d 8
    networks: [internal]

volumes:
  db_data:
  # Meilisearch data, one volume per exact server version (see the meilisearch service above). The old
  # `meili_data` (v1.12.3) is intentionally no longer declared: compose never deletes an undeclared
  # volume, so it survives until the operator removes it (docs/05-runbooks/deploy-self-hosted.md).
  meili_data_v1_53_2:
  # Valkey AOF (ADR-0053). Holds in-flight BullMQ job state — transport, not the system of record
  # (that's Postgres). Persisted so queued jobs survive `down`/recreate; safe to drop for a clean reset.
  valkey_data:
  caddy_data:
  caddy_config:
  # User-uploaded attachment blobs (ADR-0082): `<sha[0:2]>/<sha256>` content-addressed files + a
  # tmp/ staging dir, mounted on the api at /app/attachments. Domain data — NOT rebuildable.
  # Backed up by the `backup` sidecar (mounted READ-ONLY there): each run writes
  # attachments-<ts>.tar.gz beside app-<ts>.dump, same schedule/retention/offsite hook (#1467). The
  # sidecar never writes to this volume; a restore is a manual, documented step
  # (docs/05-runbooks/backups.md).
  attachments_data:
  # The bundled Zitadel's zitadel_db_data and zitadel_secrets are intentionally no longer declared
  # (ADR-0102): compose never deletes an undeclared volume, so any left on a host stay until the
  # operator removes them.

networks:
  internal:
    driver: bridge

# -----------------------------------------------------------------------------
# Re-pinning an image digest after a deliberate upgrade (ADR-0025 follow-up):
#   docker pull <image>:<tag>
#   docker buildx imagetools inspect <image>:<tag> --format '{{.Manifest.Digest}}'
# (or, with `skopeo inspect docker://<image>:<tag> | jq -r .Digest`). Replace the @sha256:...
# beside the matching tag comment. Always re-pin via a deliberate bump — never let a rolling tag
# (node:26-alpine, caddy:2-alpine) drift silently.
# -----------------------------------------------------------------------------
